kind = "web"
previewPath = "/trynext-promo/"
title = "Trynext Promo Animation"
version = "1.0.0"
id = "artifacts/trynext-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/trynext-promo/" ]
localPort = 8083

[services.development]
run = "pnpm --filter @workspace/trynext-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trynext-promo", "run", "build" ]
publicDir = "artifacts/trynext-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8083"
BASE_PATH = "/trynext-promo/"
