kind = "mobile"
previewPath = "/mobile/"
title = "Trynext Mobile"
version = "1.0.0"
id = "artifacts/trynext-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mobile/" ]
localPort = 8084

[services.development]
run = "pnpm --filter @workspace/trynext-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trynext-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/trynext-mobile", "run", "serve" ]

[services.env]
PORT = "8084"
BASE_PATH = "/mobile/"
