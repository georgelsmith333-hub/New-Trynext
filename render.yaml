services:
  - type: web
    name: trynext-lifestyle-main-render
    env: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8082"
      - key: TRYNEXT_RUNTIME_ROLE
        value: primary
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: BACKUP_SYNC_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: trynext-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Durable private artwork storage. These are intentionally unpopulated
      # in source control and must be entered in Render's secret manager.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      # Telegram is owner-configured after the bot's private chat is verified.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    # The API mounts health routes under /api; use the meaningful dependency check.
    healthCheckPath: /api/health/readiness
    healthCheckInterval: 10
    maxInstances: 3
    minInstances: 1
    autoDeploy: true

databases:
  - name: trynext-db
    databaseName: trynext_prod
    user: trynext_user
    region: oregon
    plan: starter
    postgresMajorVersion: "16"
